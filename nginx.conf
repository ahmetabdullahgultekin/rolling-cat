server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Site-specific Content-Security-Policy (ported from the old Hostinger
    # .htaccess). Generic security headers (HSTS, X-Frame-Options, nosniff,
    # Referrer-Policy, Permissions-Policy) are applied by Traefik's
    # secure-headers@file middleware, same as every other site on this box.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # RFC 9116 security.txt must be served as text/plain.
    location = /.well-known/security.txt { default_type text/plain; charset utf-8; }
    location = /security.txt           { default_type text/plain; charset utf-8; }

    # Long-cache immutable static assets; shorter for images.
    location ~* \.(css|js|svg|woff2)$ { expires 1y;  add_header Cache-Control "public, immutable"; }
    location ~* \.(png|jpe?g|gif|ico)$ { expires 30d; add_header Cache-Control "public"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
